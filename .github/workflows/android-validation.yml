name: KAI TRAD Android Validation

on:
  push:
    branches:
      - main
      - agent/kai-trad-android-shell-v1
    paths:
      - 'android/**'
      - '.github/workflows/android-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore validation signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kai-trad-android-debug-key-v1

      - name: Ensure validation signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=KAI TRAD Validation,O=Arda Core Corporation,C=ID" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate debug and release builds
        working-directory: android
        run: gradle --no-daemon clean assembleDebug assembleRelease

      - name: Upload installable RC APK
        uses: actions/upload-artifact@v4
        with:
          name: KAI-TRAD-Android-RC
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
